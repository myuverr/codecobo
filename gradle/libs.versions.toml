# SPDX-License-Identifier: MPL-2.0

[versions]
# The platform package carries a minor version, so CI installs it separately from compileSdk.
android-compileSdk = "37"
android-minSdk = "33"
android-targetSdk = "37"
android-platform = "37.0"
android-buildTools = "36.0.0"
agp = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
room = "2.8.5"
datastore = "1.3.0"
shizuku = "13.1.5"
hiddenapibypass = "6.2"
annotations = "1.11.0"
material3 = "1.5.0"
activity = "1.13.0"
navigation3 = "1.2.2"
window = "1.5.1"
lottie = "6.7.1"
junit = "4.13.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
androidx-annotations = { module = "androidx.annotation:annotation", version.ref = "annotations" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
window-core = { module = "androidx.window:window-core", version.ref = "window" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
