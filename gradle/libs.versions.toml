shizuku = "13.1.5"
hiddenapibypass = "6.1"
annotations = "1.3.0"
material3 = "1.5.0-beta02"
activity = "1.12.4"
lottie = "6.7.1"

[libraries]
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
