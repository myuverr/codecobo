# SPDX-License-Identifier: MPL-2.0
name: Gradle Updates

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency: gradle-updates

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read SDK versions
        run: python3 .github/scripts/read-sdk-versions.py >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION" < <(yes)
      - name: Install Renovate
        run: npm install --prefix "$RUNNER_TEMP/renovate" --no-audit --no-fund renovate@44.251.0
      - name: Create Renovate token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
      - name: Propose Gradle updates
        env:
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
          RENOVATE_ALLOWED_COMMANDS: '^bash [.]github/scripts/update-gradle-artifacts[.]sh$'
          RENOVATE_ONBOARDING: 'false'
        run: |
          export RENOVATE_CUSTOM_ENV_VARIABLES
          RENOVATE_CUSTOM_ENV_VARIABLES="$(jq -nc --arg home "$ANDROID_HOME" '{ANDROID_HOME: $home}')"
          "$RUNNER_TEMP/renovate/node_modules/.bin/renovate" "$GITHUB_REPOSITORY"
