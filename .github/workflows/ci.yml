# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '25'
  SDK_PLATFORM: 'platforms;android-37.0'
  BUILD_TOOLS_VERSION: '36.0.0'
  APP_NAME: Codecobo
  APP_ID: com.myuverr.codecobo
  SIGNING_CERT_SHA256: 60dd70662aee751b76c6258817a8929acda8a6545558f74dcfcce6051c9ffded

jobs:
  changes:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Check commit messages
        shell: python
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          import os
          import re
          import subprocess

          if subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"]).returncode != 0:
              raise SystemExit("CI source must belong to main history")
          build = True
          before = os.environ.get("BEFORE", "")
          if (os.environ["GITHUB_EVENT_NAME"] == "push"
                  and os.environ["GITHUB_REF"] == "refs/heads/main"
                  and re.fullmatch(r"[0-9a-f]{40}", before)
                  and before != "0" * 40
                  and subprocess.run(["git", "merge-base", "--is-ancestor", before, "HEAD"],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0):
              log = subprocess.check_output([
                  "git", "log", "--no-show-signature", "--max-count=129",
                  "--format=%B%x00", before + "..HEAD"
              ]).decode("utf-8", "surrogateescape")
              messages = [m.strip() for m in log.split("\0") if m.strip()]
              build = not (0 < len(messages) <= 128 and all(
                  re.match(r"docs(?:\([^)]+\))?:[ \t]+\S", m.splitlines()[0], re.IGNORECASE)
                  and not re.search(r"^BREAKING(?: CHANGE|-CHANGE):[ \t]", m, re.MULTILINE)
                  for m in messages
              ))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("build=" + str(build).lower() + "\n")
          print("Build required:", build)

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docs-only pushes never enter this group or cancel a running code build.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION" < <(yes)
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - id: gradle
        name: Build, lint and sign
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing"
            exit 1
          fi
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/codecobo-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/keystore.p12"
          export CODECOBO_KEYSTORE_FILE="$signing_dir/keystore.p12"
          export CODECOBO_KEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
          unset SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD
          # Configuration-cache snapshots must not retain signing credentials.
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            --dependency-verification=strict lintDebug lintRelease assembleDebug assembleRelease < /dev/null
      - id: apks
        name: Verify and name APKs
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / os.environ["BUILD_TOOLS_VERSION"]
          apks = {
              "debug": pathlib.Path("app/build/outputs/apk/debug/app-debug.apk"),
              "release": pathlib.Path("app/build/outputs/apk/release/app-release.apk"),
          }
          versions = {}
          for variant, apk in apks.items():
              badging = subprocess.check_output([str(tools / "aapt2"), "dump", "badging", str(apk)], text=True)
              package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",
                                  badging, re.MULTILINE)
              if not package or package[1] != os.environ["APP_ID"] or int(package[2]) < 1:
                  raise SystemExit("Unexpected APK identity: " + variant)
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", package[3]):
                  raise SystemExit("Unsupported APK version: " + variant)
              if ("minSdkVersion:'33'" not in badging or "targetSdkVersion:'37'" not in badging
                      or ("application-debuggable" in badging) != (variant == "debug")):
                  raise SystemExit("Unexpected APK configuration: " + variant)
              versions[variant] = (package[3], package[2])
              verified = subprocess.check_output([
                  str(tools / "apksigner"), "verify", "--verbose", "--print-certs", str(apk)
              ], text=True)
              signers = re.findall(r"^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]+)$",
                                   verified, re.MULTILINE)
              if (signers != [os.environ["SIGNING_CERT_SHA256"]]
                      or "Verified using v3 scheme (APK Signature Scheme v3): true" not in verified):
                  raise SystemExit("Unexpected APK signing certificate or scheme: " + variant)
              subprocess.run([str(tools / "zipalign"), "-c", "-P16", "4", str(apk)], check=True)
          if versions["debug"] != versions["release"]:
              raise SystemExit("Debug and Release versions differ")
          version, _ = versions["release"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != "v" + version:
              raise SystemExit("Tag does not match the APK version")
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          short_sha = subprocess.check_output(["git", "rev-parse", "--short=7", "HEAD"], text=True).strip()
          prefix = os.environ["APP_NAME"] + "-" + version + "-" + short_sha
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "apks"
          target.mkdir()
          for variant, apk in apks.items():
              shutil.copyfile(apk, target / (prefix + "-" + variant + ".apk"))
          release_apk = target / (prefix + "-release.apk")
          (target / "release.json").write_text(json.dumps({
              "source_sha": source_sha, "version": version, "apk": release_apk.name,
              "sha256": hashlib.sha256(release_apk.read_bytes()).hexdigest(),
          }) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("prefix=" + prefix + "\n")
      - name: Retain Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apks.outputs.prefix }}-debug
          path: ${{ runner.temp }}/apks/${{ steps.apks.outputs.prefix }}-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain Release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apks.outputs.prefix }}-release
          path: |
            ${{ runner.temp }}/apks/${{ steps.apks.outputs.prefix }}-release.apk
            ${{ runner.temp }}/apks/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain Lint reports and R8 mapping
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reports
          path: |
            app/build/reports/lint-results-*
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90
