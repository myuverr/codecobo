# SPDX-License-Identifier: MPL-2.0
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  SDK_PLATFORM: 'platforms;android-37.0'
  BUILD_TOOLS_VERSION: '36.0.0'
  APP_NAME: Codecobo
  APP_ID: com.myuverr.codecobo

jobs:
  verify:
    name: verify-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION" < <(yes)
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Run unit tests
        run: |
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            --dependency-verification=strict testDebugUnitTest < /dev/null
      - name: Verify test execution
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET

          reports = pathlib.Path("app/build/test-results/testDebugUnitTest")
          executed = 0
          for report in reports.glob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  if case.find("skipped") is None:
                      executed += 1
          if executed == 0:
              raise SystemExit("No unit tests executed; add real regression tests before merging")
          print("Unit tests executed:", executed)
      - id: gradle
        name: Build, lint and sign test APKs
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/codecobo-pr-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export CODECOBO_KEYSTORE_FILE="$signing_dir/keystore.p12"
          CODECOBO_KEYSTORE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export CODECOBO_KEYSTORE_PASSWORD
          printf '::add-mask::%s\n' "$CODECOBO_KEYSTORE_PASSWORD"
          keytool -genkeypair -storetype PKCS12 -alias codecobo \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -dname "CN=Codecobo PR Test" -validity 2 \
            -keystore "$CODECOBO_KEYSTORE_FILE" \
            -storepass:env CODECOBO_KEYSTORE_PASSWORD \
            -keypass:env CODECOBO_KEYSTORE_PASSWORD < /dev/null
          keytool -exportcert -alias codecobo \
            -keystore "$CODECOBO_KEYSTORE_FILE" \
            -storepass:env CODECOBO_KEYSTORE_PASSWORD \
            -file "$signing_dir/certificate.der" < /dev/null
          signing_cert="$(sha256sum "$signing_dir/certificate.der" | cut -d ' ' -f 1)"
          printf 'signing_cert_sha256=%s\n' "$signing_cert" >> "$GITHUB_OUTPUT"
          # Never retain signing credentials in a daemon or configuration-cache snapshot.
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            --dependency-verification=strict lintDebug lintRelease assembleDebug assembleRelease < /dev/null
      - id: apks
        name: Verify and name test APKs
        shell: python
        env:
          SIGNING_CERT_SHA256: ${{ steps.gradle.outputs.signing_cert_sha256 }}
        run: |
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / os.environ["BUILD_TOOLS_VERSION"]
          apks = {
              "debug": pathlib.Path("app/build/outputs/apk/debug/app-debug.apk"),
              "release": pathlib.Path("app/build/outputs/apk/release/app-release.apk"),
          }
          versions = {}
          for variant, apk in apks.items():
              badging = subprocess.check_output([str(tools / "aapt2"), "dump", "badging", str(apk)], text=True)
              package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",
                                  badging, re.MULTILINE)
              if not package or package[1] != os.environ["APP_ID"] or int(package[2]) < 1:
                  raise SystemExit("Unexpected APK identity: " + variant)
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", package[3]):
                  raise SystemExit("Unsupported APK version: " + variant)
              if ("minSdkVersion:'33'" not in badging or "targetSdkVersion:'37'" not in badging
                      or ("application-debuggable" in badging) != (variant == "debug")):
                  raise SystemExit("Unexpected APK configuration: " + variant)
              versions[variant] = (package[3], package[2])
              verified = subprocess.check_output([
                  str(tools / "apksigner"), "verify", "--verbose", "--print-certs", str(apk)
              ], text=True)
              signers = re.findall(r"^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]+)$",
                                   verified, re.MULTILINE)
              if (signers != [os.environ["SIGNING_CERT_SHA256"]]
                      or "Verified using v3 scheme (APK Signature Scheme v3): true" not in verified):
                  raise SystemExit("Unexpected APK signing certificate or scheme: " + variant)
              subprocess.run([str(tools / "zipalign"), "-c", "-P16", "4", str(apk)], check=True)
          if versions["debug"] != versions["release"]:
              raise SystemExit("Debug and Release versions differ")
          version, _ = versions["release"]
          short_sha = subprocess.check_output(["git", "rev-parse", "--short=7", "HEAD"], text=True).strip()
          prefix = os.environ["APP_NAME"] + "-" + version + "-" + short_sha
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "apks"
          target.mkdir()
          for variant, apk in apks.items():
              shutil.copyfile(apk, target / (prefix + "-" + variant + ".apk"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("prefix=" + prefix + "\n")
      - name: Retain Debug test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apks.outputs.prefix }}-debug
          path: ${{ runner.temp }}/apks/${{ steps.apks.outputs.prefix }}-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain Release test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apks.outputs.prefix }}-release
          path: ${{ runner.temp }}/apks/${{ steps.apks.outputs.prefix }}-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Describe test signing
        env:
          SIGNING_CERT_SHA256: ${{ steps.gradle.outputs.signing_cert_sha256 }}
        run: |
          {
            printf '### PR test APKs\n\n'
            printf 'Both APKs use a disposable certificate generated for this run. '
            printf 'They cannot update a production-signed installation.\n\n'
            printf 'Certificate SHA-256: `%s`\n' "$SIGNING_CERT_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/
            app/build/reports/lint-results-*
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90
